<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отпуска УГИ 2027 — интерактивный график</title>
<style>
:root{
  --bg:#0d1117; --bg2:#111823; --panel:#161d29; --line:#243040;
  --tx:#e6edf3; --tx2:#8b98a9; --accent:#4c9aff; --accent2:#70ad47;
  --chip:#1b2432; --shadow:0 8px 30px rgba(0,0,0,.45);
  --beam:#8fb0e8; --beamop:.10;
}
html[data-theme="light"]{
  --bg:#eef2f7; --bg2:#f7f9fc; --panel:#ffffff; --line:#d3dbe6;
  --tx:#1b2430; --tx2:#5d6b7d; --accent:#2f6fd0; --accent2:#4b8b2e;
  --chip:#e7edf5; --shadow:0 8px 26px rgba(30,50,80,.14);
  --beam:#ffe6b8; --beamop:.30;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--tx); overflow:hidden;
  font:13px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
/* Луч солнца. Статичный градиент поверх фона, под интерфейсом: рисуется
   один раз видеокартой, на кадр не влияет. Частицы на фоне ярче там, где
   проходит эта полоса -- см. v_lit в VS_PART. */
#beam{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  mix-blend-mode:screen; opacity:var(--beamop);
  background:linear-gradient(104deg,
    transparent 14%, var(--beam) 40%, transparent 66%);
  transition:opacity .4s ease;
}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

header{
  display:flex;align-items:center;gap:14px;padding:10px 16px;
  background:color-mix(in srgb, var(--bg2) 88%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
h1 small{display:block;font-weight:400;font-size:11px;color:var(--tx2);margin-top:1px}
.spacer{flex:1}
button,select,input{font:inherit;color:var(--tx)}
.btn{
  background:var(--chip);border:1px solid var(--line);border-radius:8px;
  padding:6px 11px;cursor:pointer;transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
#theme{font-size:16px;line-height:1;padding:5px 10px}

.bar{
  display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap;
  background:var(--bg2);border-bottom:1px solid var(--line);
}
#tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{
  border:1px solid var(--line);background:var(--chip);border-radius:999px;
  padding:4px 12px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:7px;
  transition:background .15s,color .15s,border-color .15s;
}
.tab .dot{width:9px;height:9px;border-radius:50%;flex:none}
.tab:hover{border-color:var(--accent)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab.on .dot{box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.tab .n{opacity:.7;font-size:11px}

input[type=search],select{
  background:var(--chip);border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;outline:none;
}
input[type=search]{width:190px}
input[type=search]:focus,select:focus{border-color:var(--accent)}

main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;overflow:hidden;user-select:none}
#grid{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#ovl{position:absolute;inset:0;pointer-events:none;overflow:hidden}

#colhead{position:absolute;left:0;right:0;top:0;height:46px;pointer-events:none}
.mhead{position:absolute;top:0;height:20px;font-size:11px;font-weight:600;
  text-align:center;color:var(--tx2);border-left:1px solid var(--line);
  overflow:hidden;white-space:nowrap}
.dhead{position:absolute;top:20px;height:26px;font-size:9px;color:var(--tx2);
  text-align:center;overflow:hidden;line-height:12px;padding-top:2px}
.dhead b{display:block;font-weight:600;color:var(--tx)}
.dhead.we b{color:#e5707a}

#names{position:absolute;left:0;top:46px;bottom:64px;width:262px;
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  border-right:1px solid var(--line);overflow:hidden}
.nrow{position:absolute;left:0;right:0;display:flex;align-items:center;gap:7px;
  padding:0 8px;white-space:nowrap;overflow:hidden;border-bottom:1px solid
  color-mix(in srgb, var(--line) 45%, transparent)}
.nrow .sv{width:8px;height:8px;border-radius:2px;flex:none}
.nrow .t{font-size:11px;overflow:hidden;text-overflow:ellipsis}
.nrow .tn{opacity:.55;font-size:10px;flex:none}

#strip{position:absolute;left:262px;right:0;bottom:0;height:64px;
  background:color-mix(in srgb, var(--bg2) 86%, transparent);
  border-top:1px solid var(--line)}
#strip .cap{position:absolute;left:8px;top:3px;font-size:10px;color:var(--tx2)}
#strip canvas{position:absolute;left:0;right:0;bottom:0;width:100%;height:48px}

aside{
  width:300px;flex:none;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
aside.hide{display:none}
aside h2{font-size:12px;margin:0;padding:11px 14px;border-bottom:1px solid var(--line);
  font-weight:600;letter-spacing:.2px}
#panelBody{overflow:auto;padding:10px 14px 20px;font-size:12px}
.kpi{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin-bottom:14px}
.kpi div:nth-child(odd){color:var(--tx2)}
.kpi div:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.sec{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--tx2);border-top:1px solid var(--line);padding-top:9px}
.who{display:flex;align-items:center;gap:8px;padding:4px 0}
.who .sv{width:8px;height:8px;border-radius:2px;flex:none}
.who .g{opacity:.6;font-size:10px;margin-left:auto;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:5px 12px}
.legend span{display:flex;align-items:center;gap:5px;font-size:11px}
.legend i{width:9px;height:9px;border-radius:2px;display:block}
#tip{
  position:fixed;z-index:5;pointer-events:none;display:none;max-width:290px;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;box-shadow:var(--shadow);font-size:12px;
}
#tip b{display:block;margin-bottom:3px}
#tip .v{color:var(--tx2);font-size:11px}
#note{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:6;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:7px 14px;font-size:11px;color:var(--tx2);box-shadow:var(--shadow)}
#note.hide{display:none}
.hint{color:var(--tx2);font-size:11px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="beam"></div>
<div class="wrap">
  <header>
    <h1>Отпуска УГИ 2027
      <small id="built">интерактивный график пересечений отпусков</small></h1>
    <div class="spacer"></div>
    <input type="search" id="q" placeholder="поиск по ФИО…">
    <select id="grp"><option value="">все группы</option></select>
    <button class="btn" id="fit">Вся сетка</button>
    <button class="btn" id="today">Сегодня</button>
    <button class="btn" id="theme" title="Сменить тему">🌙</button>
  </header>

  <div class="bar"><div id="tabs"></div></div>

  <main>
    <div id="stage">
      <canvas id="grid"></canvas>
      <div id="ovl">
        <div id="colhead"></div>
        <div id="names"></div>
      </div>
      <div id="strip">
        <div class="cap">Нагрузка по дням — наведите или щёлкните по дню</div>
        <canvas id="load"></canvas>
      </div>
    </div>
    <aside id="panel">
      <h2>Сводка</h2>
      <div id="panelBody"></div>
    </aside>
  </main>
</div>
<div id="tip"></div>
<div id="note" class="hide"></div>

const MD = [];               // {m, d, wd} на каждый день года

}

  if(n.getFullYear()!==YEAR) return -1;

const cur = {svc:-1, grp:"", q:"", day:TODAY};
const cam = {sx:3, sy:14, ox:0, oy:0};
let rows = [], byDay = null, peak = 0, peakDay = 0, stripCurve = null;
let hoverR = -1, hoverD = -1, dirtyOv = true, dirtyData = true;

/* цвета темы, которые плавно интерполируются в кадре -- объявлены до
   setTheme(), иначе обращение к ним упало бы на первом же вызове.

let tintNow = [0.42,0.62,1.0], tintTarget = [0.42,0.62,1.0];
let sunNow  = [0.62,0.76,1.0], sunTarget  = [0.62,0.76,1.0];

function setTheme(t, save){
  root.setAttribute("data-theme", t);
  document.getElementById("theme").textContent = (t==="dark")?"☀️":"\u{1F319}";
  if(save){ try{ localStorage.setItem("ugi-theme", t); }catch(e){} }
  /* Яркость пылинки (v_a) максимальна в луче, и цвет там берётся из u_sun
     (шейдер: col = mix(u_tint, u_sun, v_lit)). Поэтому u_sun обязан быть
     САМЫМ контрастным цветом темы, иначе самые плотные пылинки окажутся
     самыми бледными. В тёмной теме это значит "ярче фона", в светлой --
     "темнее фона": в светлом поле пыль читается тёмными крупинками.
     Раньше в светлой теме u_sun был светлее u_tint -- контраст падал ровно
     там, где росла альфа, и пыль пропадала. */
  tintTarget = (t==="dark") ? [0.50,0.62,0.88] : [0.72,0.73,0.76];

function hex2rgb(h){
  h = h.replace("#","");
  return [parseInt(h.substr(0,2),16)/255, parseInt(h.substr(2,2),16)/255,
          parseInt(h.substr(4,2),16)/255];
}
function rgb2css(c){ return "rgb("+Math.round(c[0]*255)+","+Math.round(c[1]*255)+
                            ","+Math.round(c[2]*255)+")"; }

function buildView(){
  const svcs = (cur.svc<0) ? D.services : [D.services[cur.svc]];
  const q = cur.q.trim().toLowerCase();
  const out = [];
  for(const s of svcs){
    for(const p of s.people){
      if(cur.grp && p.grp !== cur.grp) continue;
      if(q && p.f.toLowerCase().indexOf(q)<0 && (""+p.t).indexOf(q)<0) continue;
      out.push({
        f:p.f, t:p.t, pos:p.pos, grp:p.grp, sch:p.s,
        svc:s.short, svcName:s.name,
        color: (cur.svc<0) ? s.color : (s.gcolors[p.grp] || "#8899aa"),
        vac:p.v
      });
    }
  }
  rows = out;

  /* кривая нагрузки по каждому дню -- по отфильтрованным строкам */
  const cv = new Array(NDAYS).fill(0);
  for(const r of rows){
    for(const v of r.vac){
      for(let k=0;k<v[1];k++){ const d=v[0]+k; if(d>=0&&d<NDAYS) cv[d]++; }
    }
  }
  stripCurve = cv;
  peak = 0; peakDay = 0;
  for(let i=0;i<NDAYS;i++) if(cv[i]>peak){ peak=cv[i]; peakDay=i; }

  /* кто в отпуске по дням -- для панели и тултипа */
  byDay = [];
  for(let i=0;i<NDAYS;i++) byDay.push([]);
  for(let i=0;i<rows.length;i++){
    const r = rows[i];
    for(const v of r.vac){
      for(let k=0;k<v[1];k++){
        const d = v[0]+k;
        if(d>=0 && d<NDAYS) byDay[d].push(i);
      }
    }
  }
  dirtyOv = true; dirtyData = true;
}

function fit(){
  const st = document.getElementById("stage");
  const w = st.clientWidth - NAMES_W;
  const h = st.clientHeight - HDR_H - STRIP_H;
  cam.sx = w / NDAYS;
  cam.sy = Math.max(11, Math.min(22, h / Math.max(1, rows.length)));
  cam.ox = 0;
  cam.oy = 0;
  if(rows.length * cam.sy <= h) cam.oy = 0;
  dirtyOv = true;
}

/* ======================================================================
   WebGL
   ====================================================================== */
const glc = document.getElementById("grid");
const bgc = document.getElementById("bg");
const lc  = document.getElementById("load");
let gl=null, glbg=null, glload=null, ok=false, ext=null, isGL2=false;

function ctxOf(cv, opts){
  const names = ["webgl2","webgl","experimental-webgl"];
  for(const n of names){
    try{
      const c = cv.getContext(n, opts||{antialias:false,alpha:true,
        premultipliedAlpha:false,powerPreference:"high-performance"});
      if(c){ isGL2 = (n==="webgl2"); return c; }
    }catch(e){}
  }
  return null;
}

const VS_QUAD =
 "attribute vec2 a_corner;\n"+
 "attribute vec4 a_rect;\n"+
 "attribute vec4 a_color;\n"+
 "uniform vec2 u_origin;\n"+
 "uniform vec2 u_cell;\n"+
 "uniform vec2 u_res;\n"+
 "varying vec4 v_color;\n"+
 "void main(){\n"+
 "  vec2 p = u_origin + (a_rect.xy + a_corner*a_rect.zw) * u_cell;\n"+
 "  vec2 c = (p/u_res)*2.0 - 1.0;\n"+
 "  gl_Position = vec4(c.x, -c.y, 0.0, 1.0);\n"+
 "  v_color = a_color;\n"+
 "}";
const FS_QUAD =
 "precision mediump float;\n"+
 "varying vec4 v_color;\n"+
 "void main(){ gl_FragColor = v_color; }";

/* Пылинки в луче солнца.
   Всё считается в вершинном шейдере от одного u_time -- на кадр у процессора
   работы нет. Что делает картинку похожей на настоящую пыль:
     - глубина: ближние пылинки крупнее, ярче и сильнее расфокусированы;
     - броуновское блуждание: две синусоиды разных частот вместо ровного сноса;
     - луч: наклонная полоса, вне неё пылинка почти не видна, внутри -- светится;
     - мерцание: пылинка поворачивается и то ловит свет, то нет.
   Полоса луча задана и здесь, и градиентом #beam в CSS -- они должны
   попадать примерно в одно место, иначе пыль светится мимо луча. */
const VS_PART =
 "attribute vec4 a_seed;\n"+    /* xy -- позиция, z -- глубина (0 далеко, 1 близко), w -- запас */
 "attribute vec4 a_param;\n"+   /* x -- скорость, y -- размер, z -- фаза, w -- частота качания */
 "uniform float u_time;\n"+
 "uniform vec2 u_par;\n"+
 "uniform vec2 u_res;\n"+
 "varying float v_a;\n"+        /* яркость пылинки */
 "varying float v_blur;\n"+     /* расфокусировка: ближние мутнее */
 "varying float v_lit;\n"+      /* 1 -- в луче, 0 -- в тени */
 "void main(){\n"+
 "  float d = a_seed.z;\n"+
 "  vec2 p = a_seed.xy;\n"+
 "  p.y = fract(p.y - u_time*a_param.x*(0.006 + 0.020*d));\n"+
 "  float t = u_time*a_param.w;\n"+
 "  p.x += (sin(t + a_param.z)*0.018 +\n"+
 "          sin(t*0.37 + a_param.z*2.1)*0.042) * (0.35 + 1.15*d);\n"+
 "  p.x = fract(p.x);\n"+
 "  p += u_par*(0.006 + 0.030*d);\n"+
 "  gl_Position = vec4(p.x*2.0-1.0, 1.0-p.y*2.0, 0.0, 1.0);\n"+
 "  gl_PointSize = a_param.y*(0.25 + 1.1*d)*(u_res.y/820.0);\n"+
 "  float axis = p.x - 0.30 - (1.0 - p.y)*0.46;\n"+
 "  v_lit = exp(-axis*axis*20.0);\n"+
 "  float fl = 0.55 + 0.45*sin(u_time*(0.9 + a_param.x) + a_param.z*3.0);\n"+
 "  v_blur = 0.25 + 0.75*d;\n"+
 /* фон должен читаться как пыль, а не спорить с сеткой графиков:
    даже в луче пылинка светится вполсилы, вне луча -- почти гаснет */
 "  v_a = (0.07 + 0.78*v_lit)*fl*(0.28 + 0.72*d)*(1.0 - 0.5*d*d);\n"+
 "  v_a *= smoothstep(0.0,0.06,p.x)*(1.0-smoothstep(0.94,1.0,p.x));\n"+
 "}";
const FS_PART =
 "precision mediump float;\n"+
 "uniform vec3 u_tint;\n"+
 "uniform vec3 u_sun;\n"+
 "uniform float u_alpha;\n"+
 "varying float v_a;\n"+
 "varying float v_blur;\n"+
 "varying float v_lit;\n"+
 "void main(){\n"+
 "  float r = length(gl_PointCoord - 0.5)*2.0;\n"+
 /* ядро + ореол: у ближних пылинок ореол шире -- так выглядит расфокус */
 "  float core = exp(-r*r*(7.0 - 4.0*v_blur));\n"+
 "  float halo = exp(-r*r*1.6)*(0.06 + 0.30*v_blur);\n"+
 "  float a = (core + halo)*(1.0 - smoothstep(0.6,1.0,r));\n"+
 "  vec3 col = mix(u_tint, u_sun, v_lit);\n"+
 /* холст объявлен premultipliedAlpha, поэтому rgb надо домножить на ту же
    прозрачность, что уходит в альфу: иначе яркость пыли зависит от цвета
    темы и светлая с тёмной разъезжаются */
 "  float al = a*u_alpha*v_a;\n"+
 "  gl_FragColor = vec4(col*al, al);\n"+
 "}";

function sh(c, type, src){
  const s = c.createShader(type);
  c.shaderSource(s, src); c.compileShader(s);
  if(!c.getShaderParameter(s, c.COMPILE_STATUS)){
    console.error(c.getShaderInfoLog(s)); return null;
  }
  return s;
}
function prog(c, vs, fs){
  const p = c.createProgram();
  c.attachShader(p, sh(c, c.VERTEX_SHADER, vs));
  c.attachShader(p, sh(c, c.FRAGMENT_SHADER, fs));
  c.linkProgram(p);
  if(!c.getProgramParameter(p, c.LINK_STATUS)){
    console.error(c.getProgramInfoLog(p)); return null;
  }
  return p;
}
function instFns(c){
  if(isGL2) return {
    divisor: function(i,d){ c.vertexAttribDivisor(i,d); },
    draw: function(n){ c.drawArraysInstanced(c.TRIANGLE_STRIP,0,4,n); }
  };
  const e = c.getExtension("ANGLE_instanced_arrays");
  if(!e) return null;
  return {
    divisor: function(i,d){ e.vertexAttribDivisorANGLE(i,d); },
    draw: function(n){ e.drawArraysInstancedANGLE(c.TRIANGLE_STRIP,0,4,n); }
  };
}

let qp=null, quadBuf=null, colBuf=null, rectBuf=null, INF=null;
let stripRect=null, stripCol=null;
let lastInst=0;
let qpPart=null, partSeed=null, partParam=null, NPART=0;
let t0 = performance.now();

function initGL(){
  gl = ctxOf(glc, {antialias:false, alpha:true, premultipliedAlpha:false});
  if(!gl) return false;
  INF = instFns(gl);
  if(!INF) return false;
  qp = prog(gl, VS_QUAD, FS_QUAD);
  if(!qp) return false;
  gl.useProgram(qp);
  qp.a_corner = gl.getAttribLocation(qp,"a_corner");
  qp.a_rect   = gl.getAttribLocation(qp,"a_rect");
  qp.a_color  = gl.getAttribLocation(qp,"a_color");
  qp.u_origin = gl.getUniformLocation(qp,"u_origin");
  qp.u_cell   = gl.getUniformLocation(qp,"u_cell");
  qp.u_res    = gl.getUniformLocation(qp,"u_res");

  quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 1,0, 0,1, 1,1]),
                gl.STATIC_DRAW);
  gl.enableVertexAttribArray(qp.a_corner);
  gl.vertexAttribPointer(qp.a_corner,2,gl.FLOAT,false,0,0);
  INF.divisor(qp.a_corner,0);

  rectBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, rectBuf);
  gl.enableVertexAttribArray(qp.a_rect);
  gl.vertexAttribPointer(qp.a_rect,4,gl.FLOAT,false,0,0);
  INF.divisor(qp.a_rect,1);

  colBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
  gl.enableVertexAttribArray(qp.a_color);
  gl.vertexAttribPointer(qp.a_color,4,gl.FLOAT,false,0,0);
  INF.divisor(qp.a_color,1);

  stripRect = gl.createBuffer();
  stripCol  = gl.createBuffer();

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  /* ---- частицы ---- */
  glbg = ctxOf(bgc, {antialias:false, alpha:true});
  if(glbg){
    qpPart = prog(glbg, VS_PART, FS_PART);
    if(qpPart){
      glbg.useProgram(qpPart);
      qpPart.a_seed  = glbg.getAttribLocation(qpPart,"a_seed");
      qpPart.a_param = glbg.getAttribLocation(qpPart,"a_param");
      qpPart.u_time  = glbg.getUniformLocation(qpPart,"u_time");
      qpPart.u_par   = glbg.getUniformLocation(qpPart,"u_par");
      qpPart.u_res   = glbg.getUniformLocation(qpPart,"u_res");
      qpPart.u_tint  = glbg.getUniformLocation(qpPart,"u_tint");
      qpPart.u_sun   = glbg.getUniformLocation(qpPart,"u_sun");
      qpPart.u_alpha = glbg.getUniformLocation(qpPart,"u_alpha");
      buildParticles();
      glbg.enable(glbg.BLEND);
      /* обычное смешивание, а не аддитивное: пылинка просто проявляет свой
         цвет поверх фона. Так её заметность равна заданной прозрачности и
         одинаково ведёт себя в светлой и тёмной темах */
      glbg.blendFunc(glbg.ONE, glbg.ONE_MINUS_SRC_ALPHA);
    } else { glbg = null; }
  }
  return true;
}

function buildParticles(){
  const c = glbg;
  if(partSeed){ c.deleteBuffer(partSeed); partSeed = null; }
  if(partParam){ c.deleteBuffer(partParam); partParam = null; }
  NPART = Math.min(1300, Math.max(380, Math.round(window.innerWidth*0.45)));
  const seed = new Float32Array(NPART*4), par = new Float32Array(NPART*4);
  for(let i=0;i<NPART;i++){
    /* глубина по корню: мелкой пыли должно быть больше, чем крупной */
    const d = Math.sqrt(Math.random());
    seed[i*4]   = Math.random();               /* x */
    seed[i*4+1] = Math.random();               /* y */
    seed[i*4+2] = d;                           /* глубина */
    seed[i*4+3] = Math.random();
    par[i*4]    = 0.15 + Math.random()*0.85;   /* скорость дрейфа */
    par[i*4+1]  = 1.2 + Math.random()*2.6;     /* размер, px */
    par[i*4+2]  = Math.random()*6.283;         /* фаза */
    par[i*4+3]  = 0.18 + Math.random()*0.55;   /* частота качания */
  }
  partSeed = c.createBuffer();
  c.bindBuffer(c.ARRAY_BUFFER, partSeed);
  c.bufferData(c.ARRAY_BUFFER, seed, c.STATIC_DRAW);
  c.enableVertexAttribArray(qpPart.a_seed);
  c.vertexAttribPointer(qpPart.a_seed,4,c.FLOAT,false,0,0);

  partParam = c.createBuffer();
  c.bindBuffer(c.ARRAY_BUFFER, partParam);
  c.bufferData(c.ARRAY_BUFFER, par, c.STATIC_DRAW);
  c.enableVertexAttribArray(qpPart.a_param);
  c.vertexAttribPointer(qpPart.a_param,4,c.FLOAT,false,0,0);
}

/* ---- сборка инстансов ------------------------------------------------ */
let rectArr=null, colArr=null;
function buildInstances(){
  if(!gl) return;
  const out = [];                 /* {x,y,w,h,c:[r,g,b,a]} */

  /* выходные -- колонкой на всю высоту */
  for(let i=0;i<NDAYS;i++){
    if(MD[i].wd>=5) out.push({x:i, y:0, w:1, h:rows.length, c:[0,0,0,0.16]});
  }
  /* выбранный день и сегодняшняя дата */
  if(TODAY>=0 && TODAY<NDAYS)
    out.push({x:TODAY, y:0, w:1, h:rows.length, c:[1,0.35,0.35,0.28]});
  if(cur.day>=0 && cur.day<NDAYS)
    out.push({x:cur.day, y:0, w:1, h:rows.length, c:[0.30,0.60,1.0,0.26]});
  /* отпуска */
  for(let i=0;i<rows.length;i++){
    const r = rows[i], col = hex2rgb(r.color);
    for(const v of r.vac){
      const a = Math.max(0, v[0]), b = Math.min(NDAYS, v[0]+v[1]);
      if(b<=a) continue;
      out.push({x:a, y:i, w:b-a, h:0.86, c:[col[0],col[1],col[2],1]});
    }
  }
  const n = out.length;
  rectArr = new Float32Array(n*4);
  colArr  = new Float32Array(n*4);
  for(let i=0;i<n;i++){
    const o = out[i];
    rectArr[i*4]=o.x; rectArr[i*4+1]=o.y+0.07; rectArr[i*4+2]=o.w; rectArr[i*4+3]=o.h;
    colArr[i*4]=o.c[0]; colArr[i*4+1]=o.c[1]; colArr[i*4+2]=o.c[2]; colArr[i*4+3]=o.c[3];
  }
  lastInst = n;
  gl.bindBuffer(gl.ARRAY_BUFFER, rectBuf);
  gl.bufferData(gl.ARRAY_BUFFER, rectArr, gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
  gl.bufferData(gl.ARRAY_BUFFER, colArr, gl.DYNAMIC_DRAW);

  /* полоса нагрузки -- отдельный буфер, свои единицы по вертикали */
  const m = Math.max(1, peak);
  const sa = new Float32Array(NDAYS*4), sc = new Float32Array(NDAYS*4);
  for(let i=0;i<NDAYS;i++){
    const v = stripCurve[i];
    const f = v/m;
    const c = v===0 ? [0.45,0.5,0.58,0] :
      (v>peak*0.8 ? hex2rgb("#e5534b") :
       v>peak*0.5 ? hex2rgb("#e0a53c") : hex2rgb("#4fa86a"));
    sa[i*4]=i; sa[i*4+1]=1-f; sa[i*4+2]=1; sa[i*4+3]=f||0.02;
    sc[i*4]=c[0]; sc[i*4+1]=c[1]; sc[i*4+2]=c[2]; sc[i*4+3]= v===0?0:0.95;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, stripRect);
  gl.bufferData(gl.ARRAY_BUFFER, sa, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, stripCol);
  gl.bufferData(gl.ARRAY_BUFFER, sc, gl.STATIC_DRAW);
}

function drawGL(){
  if(!gl) return;
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const W = glc.clientWidth, H = glc.clientHeight;
  if(glc.width !== Math.round(W*dpr) || glc.height !== Math.round(H*dpr)){
    glc.width = Math.round(W*dpr); glc.height = Math.round(H*dpr);
  }
  gl.viewport(0,0,glc.width,glc.height);
  gl.clearColor(0,0,0,0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(qp);

  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(qp.a_corner);
  gl.vertexAttribPointer(qp.a_corner,2,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER, rectBuf);
  gl.enableVertexAttribArray(qp.a_rect);
  gl.vertexAttribPointer(qp.a_rect,4,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf);
  gl.enableVertexAttribArray(qp.a_color);
  gl.vertexAttribPointer(qp.a_color,4,gl.FLOAT,false,0,0);
  gl.uniform2f(qp.u_res, glc.width, glc.height);
  /* перевод пикселей CSS -> пиксели буфера */
  gl.uniform2f(qp.u_origin, (NAMES_W-cam.ox)*dpr, (HDR_H-cam.oy)*dpr);
  gl.uniform2f(qp.u_cell, cam.sx*dpr, cam.sy*dpr);
  if(lastInst) INF.draw(lastInst);

  /* полоса нагрузки */
  const sh2 = H - STRIP_H, sy2 = 46;
  gl.bindBuffer(gl.ARRAY_BUFFER, stripRect);
  gl.enableVertexAttribArray(qp.a_rect);
  gl.vertexAttribPointer(qp.a_rect,4,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER, stripCol);
  gl.enableVertexAttribArray(qp.a_color);
  gl.vertexAttribPointer(qp.a_color,4,gl.FLOAT,false,0,0);
  gl.uniform2f(qp.u_origin,(NAMES_W-cam.ox)*dpr,(sh2+6)*dpr);
  gl.uniform2f(qp.u_cell, cam.sx*dpr, sy2*dpr);
  INF.draw(NDAYS);
}

/* ---- фон: частицы ---------------------------------------------------- */
let par = {x:0,y:0}, parT = {x:0,y:0};
function drawBG(t){
  if(!glbg || !qpPart) return;
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const W = bgc.clientWidth, H = bgc.clientHeight;
  if(bgc.width !== Math.round(W*dpr)){
    bgc.width = Math.round(W*dpr); bgc.height = Math.round(H*dpr);
    buildParticles();
  }
  glbg.viewport(0,0,bgc.width,bgc.height);
  glbg.clearColor(0,0,0,0);
  glbg.clear(glbg.COLOR_BUFFER_BIT);
  glbg.useProgram(qpPart);
  glbg.bindBuffer(glbg.ARRAY_BUFFER, partSeed);
  glbg.enableVertexAttribArray(qpPart.a_seed);
  glbg.vertexAttribPointer(qpPart.a_seed,4,glbg.FLOAT,false,0,0);
  glbg.bindBuffer(glbg.ARRAY_BUFFER, partParam);
  glbg.enableVertexAttribArray(qpPart.a_param);
  glbg.vertexAttribPointer(qpPart.a_param,4,glbg.FLOAT,false,0,0);
  glbg.uniform1f(qpPart.u_time, t);
  glbg.uniform2f(qpPart.u_res, bgc.width, bgc.height);
  glbg.uniform2f(qpPart.u_par, par.x, par.y);
  glbg.uniform3f(qpPart.u_tint, tintNow[0], tintNow[1], tintNow[2]);
  glbg.uniform3f(qpPart.u_sun, sunNow[0], sunNow[1], sunNow[2]);
  glbg.uniform1f(qpPart.u_alpha, particleAlpha);
  glbg.drawArrays(glbg.POINTS, 0, NPART);
}

/* ======================================================================
   Фолбэк на 2D-канвас
   ====================================================================== */
let c2=null;
function draw2D(){
  if(!c2) c2 = lc.getContext("2d");
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const g2 = glc.getContext("2d");
  const W = glc.clientWidth, H = glc.clientHeight;
  if(glc.width !== Math.round(W*dpr)){ glc.width=Math.round(W*dpr); glc.height=Math.round(H*dpr); }
  g2.setTransform(dpr,0,0,dpr,0,0);
  g2.clearRect(0,0,W,H);
  g2.fillStyle = (root.getAttribute("data-theme")==="light") ? "#5d6b7d" : "#243040";
  for(let i=0;i<NDAYS;i++){
    if(MD[i].wd<5) continue;
    g2.fillRect(NAMES_W-cam.ox+i*cam.sx, HDR_H-cam.oy, cam.sx, rows.length*cam.sy);
  }
  for(let i=0;i<rows.length;i++){
    const r = rows[i];
    g2.fillStyle = r.color;
    for(const v of r.vac){
      g2.fillRect(NAMES_W-cam.ox+v[0]*cam.sx, HDR_H-cam.oy+i*cam.sy+1,
                  Math.max(1,v[1]*cam.sx), Math.max(1,cam.sy-2));
    }
  }
  drawLoad2D();
}
function drawLoad2D(){
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const W = lc.clientWidth, H = lc.clientHeight;
  if(lc.width !== Math.round(W*dpr)){ lc.width=Math.round(W*dpr); lc.height=Math.round(H*dpr); }
  c2.setTransform(dpr,0,0,dpr,0,0);
  c2.clearRect(0,0,W,H);
  const m = Math.max(1,peak);
  for(let i=0;i<NDAYS;i++){
    const v = stripCurve[i];
    if(!v) continue;
    const f = v/m;
    c2.fillStyle = v>peak*0.8 ? "#e5534b" : v>peak*0.5 ? "#e0a53c" : "#4fa86a";
    c2.fillRect(NAMES_W-cam.ox+i*cam.sx, H*(1-f), Math.max(1,cam.sx), H*f);
  }
}

/* ======================================================================
   HTML-оверлеи: шапка календаря и колонка имён
   ====================================================================== */
const colhead = document.getElementById("colhead");
const namesEl = document.getElementById("names");
let ovHeadLast = "", ovNamesLast = "";

function layoutHeader(){
  const st = document.getElementById("stage");
  const W = st.clientWidth;
  let h = "";
  for(let m=0;m<12;m++){
    const a = MONTH_START[m], b = MONTH_END[m];
    const x0 = NAMES_W - cam.ox + a*cam.sx;
    const x1 = NAMES_W - cam.ox + (b+1)*cam.sx;
    if(x1 < NAMES_W || x0 > W) continue;
    const l = Math.max(x0, NAMES_W), r = Math.min(x1, W);
    const wide = (r-l) > 26;
    h += '<div class="mhead" style="left:'+l+'px;width:'+(r-l)+
         'px;line-height:18px">'+(wide?MON[m]:MON3[m])+'</div>';
  }
  if(cam.sx >= 13){
    const i0 = Math.max(0, Math.floor((cam.ox)/cam.sx));
    const i1 = Math.min(NDAYS-1, Math.ceil((cam.ox + (W-NAMES_W))/cam.sx));
    for(let i=i0;i<=i1;i++){
      const x = NAMES_W - cam.ox + i*cam.sx;
      const we = MD[i].wd>=5 ? " we":"";
      h += '<div class="dhead'+we+'" style="left:'+x+'px;width:'+cam.sx+
           'px"><b>'+MD[i].d+'</b>'+(cam.sx>=22?WD[MD[i].wd]:"")+'</div>';
    }
  }
  if(h !== ovHeadLast){ colhead.innerHTML = h; ovHeadLast = h; }
}

function layoutNames(){
  const st = document.getElementById("stage");
  const H = st.clientHeight - HDR_H - STRIP_H;
  let h = "";
  if(cam.sy >= 11){
    const r0 = Math.max(0, Math.floor(cam.oy/cam.sy));
    const r1 = Math.min(rows.length-1, Math.ceil((cam.oy+H)/cam.sy));
    for(let i=r0;i<=r1;i++){
      const r = rows[i];
      const y = HDR_H + i*cam.sy - cam.oy;
      h += '<div class="nrow" style="top:'+(y-HDR_H)+'px;height:'+cam.sy+
           'px"><span class="sv" style="background:'+r.color+'"></span>'+
           '<span class="t">'+esc(r.f)+'</span>'+
           '<span class="tn">'+esc(r.t)+'</span></div>';
    }
  }
  if(h !== ovNamesLast){ namesEl.innerHTML = h; ovNamesLast = h; }
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

/* ======================================================================
   Панель, подсказка, статистика
   ====================================================================== */
function dayLabel(d){
  if(d<0||d>=NDAYS) return "—";
  const dt = new Date(jan1.getTime()+d*86400000);
  const dd = MD[d].d;
  return dd+" "+MON3[MD[d].m]+" ("+WD[MD[d].wd]+")";
}
function fullLabel(d){
  if(d<0||d>=NDAYS) return "—";
  return MD[d].d+"."+String(MD[d].m+1).padStart(2,"0")+"."+YEAR;
}

function renderPanel(){
  const b = document.getElementById("panelBody");
  const planned = rows.filter(function(r){ return r.vac.length>0; }).length;
  const dTotal = rows.reduce(function(a,r){
    return a + r.vac.reduce(function(x,v){ return x+v[1]; },0); },0);
  let h = '<div class="kpi">'+
    '<div>Строк в виде</div><div>'+rows.length+'</div>'+
    '<div>С планом</div><div>'+planned+'</div>'+
    '<div>Заявлено дней</div><div>'+dTotal+'</div>'+
    '<div>Пик одновременно</div><div>'+peak+'</div>'+
    '<div>Дата пика</div><div>'+fullLabel(peakDay)+'</div>'+
    '<div>В отпуске '+fullLabel(cur.day)+'</div><div>'+
      (byDay[cur.day]?byDay[cur.day].length:0)+'</div>'+
    '</div>';

  h += '<div class="sec">Кто в отпуске — '+dayLabel(cur.day)+'</div>';
  const ids = byDay[cur.day] || [];
  if(!ids.length) h += '<div class="hint">В этот день отпусков нет.</div>';
  for(const i of ids){
    const r = rows[i];
    const parts = r.vac.filter(function(v){
      return cur.day>=v[0] && cur.day<v[0]+v[1];
    }).map(function(v){ return v[1]+" к.д. с "+fullLabel(v[0]); }).join("; ");
    h += '<div class="who"><span class="sv" style="background:'+r.color+'"></span>'+
         '<span>'+esc(r.f)+'</span><span class="g">'+esc(r.grp)+'<br>'+
         esc(parts)+'</span></div>';
  }

  h += '<div class="sec">Группы в виде</div><div class="legend">';
  const seen = {};
  for(const r of rows){
    if(seen[r.grp]) continue;
    seen[r.grp] = 1;
    h += '<span><i style="background:'+r.color+'"></i>'+esc(r.grp)+'</span>';
  }
  h += '</div>';
  b.innerHTML = h;
}

const tip = document.getElementById("tip");
function showTip(x,y,day,row){
  if(day<0||day>=NDAYS){ hideTip(); return; }
  let h = '<b>'+fullLabel(day)+', '+dayLabel(day).split(" (")[1].replace(")","")+'</b>';
  const ids = byDay[day] || [];
  h += '<div class="v">В отпуске: '+ids.length+'</div>';
  const show = ids.slice(0,8).map(function(i){ return esc(rows[i].f); });
  if(show.length) h += '<div class="v">'+show.join(", ")+
                       (ids.length>8?" и др.":"")+'</div>';
  if(row>=0 && row<rows.length){
    const r = rows[row];
    h += '<div style="margin-top:5px"><b>'+esc(r.f)+'</b>'+
         '<div class="v">'+esc(r.pos||"")+'</div>'+
         '<div class="v">'+esc(r.svcName)+' · '+esc(r.grp)+'</div>';
    if(r.vac.length){
      h += '<div class="v">'+r.vac.slice().sort(function(a,b){return a[0]-b[0];})
        .map(function(v){ return v[1]+" к.д. "+fullLabel(v[0])+" — "+
          fullLabel(v[0]+v[1]-1); }).join('<br>')+'</div>';
    } else h += '<div class="v">отпуск не запланирован</div>';
    h += '</div>';
  }
  tip.innerHTML = h;
  tip.style.display = "block";
  const w = tip.offsetWidth, hh = tip.offsetHeight;
  tip.style.left = Math.min(x+14, window.innerWidth-w-10)+"px";
  tip.style.top  = Math.min(Math.max(10, y+14), window.innerHeight-hh-10)+"px";
}
function hideTip(){ tip.style.display = "none"; }

/* ======================================================================
   Камера и ввод
   ====================================================================== */
function clampCam(){
  const st = document.getElementById("stage");
  const gw = st.clientWidth - NAMES_W;
  const gh = st.clientHeight - HDR_H - STRIP_H;
  const maxOx = Math.max(0, NDAYS*cam.sx - gw);
  cam.ox = Math.max(0, Math.min(cam.ox, maxOx));
  const maxOy = Math.max(0, rows.length*cam.sy - gh);
  cam.oy = Math.max(0, Math.min(cam.oy, maxOy));
}
function px2cell(px, py){
  const st = document.getElementById("stage");
  const d = Math.floor((px - NAMES_W + cam.ox)/cam.sx);
  const r = Math.floor((py - HDR_H + cam.oy)/cam.sy);
  return {d:d, r:r};
}

const stage = document.getElementById("stage");
let drag = null;
stage.addEventListener("mousedown", function(e){
  drag = {x:e.clientX, y:e.clientY, ox:cam.ox, oy:cam.oy, moved:false};
});
window.addEventListener("mouseup", function(e){
  if(drag && !drag.moved){
    const rc = stage.getBoundingClientRect();
    const c = px2cell(e.clientX-rc.left, e.clientY-rc.top);
    if(c.d>=0 && c.d<NDAYS){ cur.day = c.d; renderPanel(); dirtyData = true; }
  }
  drag = null;
});
window.addEventListener("mousemove", function(e){
  if(drag){
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    if(Math.abs(dx)>3 || Math.abs(dy)>3) drag.moved = true;
    cam.ox = drag.ox - dx; cam.oy = drag.oy - dy;
    clampCam(); dirtyOv = true;
    return;
  }
  const rc = stage.getBoundingClientRect();
  const px = e.clientX-rc.left, py = e.clientY-rc.top;
  if(px < 0 || py < 0 || px > rc.width || py > rc.height){ hideTip(); return; }
  const c = px2cell(px, py);
  hoverD = c.d; hoverR = (c.r>=0 && c.r<rows.length) ? c.r : -1;
  showTip(e.clientX, e.clientY, c.d, hoverR);
});
stage.addEventListener("mouseleave", hideTip);

stage.addEventListener("wheel", function(e){
  e.preventDefault();
  if(e.ctrlKey || e.shiftKey){
    const k = e.deltaY<0 ? 1.15 : 1/1.15;
    const rc = stage.getBoundingClientRect();
    const mx = e.clientX-rc.left, my = e.clientY-rc.top;
    const gx = (mx - NAMES_W + cam.ox)/cam.sx, gy = (my - HDR_H + cam.oy)/cam.sy;
    cam.sx = Math.max(0.6, Math.min(46, cam.sx*k));
    cam.sy = Math.max(3, Math.min(60, cam.sy*k));
    cam.ox = gx*cam.sx - (mx - NAMES_W);
    cam.oy = gy*cam.sy - (my - HDR_H);
  } else {
    cam.oy += e.deltaY;
    cam.ox += (e.deltaX||0);
  }
  clampCam(); dirtyOv = true;
}, {passive:false});

/* ---- панель управления ---------------------------------------------- */
function buildTabs(){
  const t = document.getElementById("tabs");
  let h = '<div class="tab'+(cur.svc<0?" on":"")+'" data-s="-1">'+
          '<span class="dot" style="background:linear-gradient(90deg,#4472C4,#70AD47,#D94F8C)">'+
          '</span>Всё УГИ<span class="n">'+D.total+'</span></div>';
  for(let i=0;i<D.services.length;i++){
    const s = D.services[i];
    h += '<div class="tab'+(cur.svc===i?" on":"")+'" data-s="'+i+'">'+
         '<span class="dot" style="background:'+s.color+'"></span>'+
         esc(s.short)+'<span class="n">'+s.people.length+'</span></div>';
  }
  t.innerHTML = h;
  Array.prototype.forEach.call(t.querySelectorAll(".tab"), function(el){
    el.addEventListener("click", function(){
      cur.svc = parseInt(el.getAttribute("data-s"),10);
      cur.grp = "";
      fillGroups(); buildTabs(); rebuild(true);
    });
  });
}
function fillGroups(){
  const sel = document.getElementById("grp");
  const svcs = (cur.svc<0) ? D.services : [D.services[cur.svc]];
  const seen = {};
  let h = '<option value="">все группы</option>';
  for(const s of svcs){
    for(const g of s.groups){
      if(seen[g]) continue;
      seen[g] = 1;
      h += '<option value="'+esc(g)+'">'+esc(g)+'</option>';
    }
  }
  sel.innerHTML = h;
}
function rebuild(refit){
  buildView();
  if(refit) fit(); else clampCam();
  buildInstances();
  layoutHeader(); layoutNames(); renderPanel();
  ovHeadLast = ovNamesLast = "";
}
document.getElementById("grp").addEventListener("change", function(e){
  cur.grp = e.target.value; buildView(); clampCam(); buildInstances();
  ovNamesLast = ""; renderPanel();
});
let qTimer = null;
document.getElementById("q").addEventListener("input", function(e){
  clearTimeout(qTimer);
  qTimer = setTimeout(function(){
    cur.q = e.target.value; buildView(); clampCam(); buildInstances();
    ovNamesLast = ""; renderPanel();
  }, 140);
});
document.getElementById("fit").addEventListener("click", function(){
  fit(); buildInstances();
});
document.getElementById("today").addEventListener("click", function(){
  if(TODAY<0){ flash("Сегодняшняя дата вне "+YEAR+" года"); return; }
  cur.day = TODAY;
  const st = document.getElementById("stage");
  const gw = st.clientWidth - NAMES_W;
  cam.ox = Math.max(0, Math.min(TODAY*cam.sx - gw/2, NDAYS*cam.sx - gw));
  clampCam(); dirtyOv = true; dirtyData = true; renderPanel();
});
document.getElementById("theme").addEventListener("click", function(){
  setTheme(root.getAttribute("data-theme")==="dark" ? "light":"dark", true);
  ovHeadLast = ovNamesLast = ""; dirtyData = true;
});
let noteTimer=null;
function flash(msg){
  const n = document.getElementById("note");
  n.textContent = msg; n.classList.remove("hide");
  clearTimeout(noteTimer);
  noteTimer = setTimeout(function(){ n.classList.add("hide"); }, 2600);
}

/* ---- размеры --------------------------------------------------------- */
function resize(){
  const st = document.getElementById("stage");
  colhead.style.height = HDR_H+"px";
  fit(); buildInstances(); ovHeadLast = ovNamesLast = "";
}
window.addEventListener("resize", function(){
  clearTimeout(resize._t);
  resize._t = setTimeout(resize, 120);
});

/* ---- цикл ------------------------------------------------------------ */
let running = true, lastFrame = 0;
document.addEventListener("visibilitychange", function(){
  running = !document.hidden;
  if(running){ lastFrame = performance.now(); requestAnimationFrame(frame); }
});
window.addEventListener("mousemove", function(e){
  /* параллакс частиц от курсора -- только два числа, вся работа на GPU */
  parT.x = (e.clientX/window.innerWidth - 0.5)*0.6;
  parT.y = (e.clientY/window.innerHeight - 0.5)*0.6;
});

function frame(now){
  if(!running) return;
  const t = (now - t0)/1000;
  if(now - lastFrame < 15){ requestAnimationFrame(frame); return; }
  lastFrame = now;

  /* плавная интерполяция цвета темы */
  for(let i=0;i<3;i++){
    tintNow[i] += (tintTarget[i]-tintNow[i])*0.08;
    sunNow[i]  += (sunTarget[i]-sunNow[i])*0.08;
  }
  par.x += (parT.x-par.x)*0.05; par.y += (parT.y-par.y)*0.05;

  if(ok){
    if(dirtyData){ buildInstances(); dirtyData = false; }
    drawGL();
    drawBG(t);
  } else {
    draw2D();
  }
  if(dirtyOv){ layoutHeader(); layoutNames(); dirtyOv = false; }

  if(ok) requestAnimationFrame(frame);
}

/* ---- старт ----------------------------------------------------------- */
document.getElementById("built").textContent =
  "интерактивный график пересечений отпусков · данных от " + D.built;

ok = initGL();
buildView();          /* обязан быть до resize()/renderPanel(): заполняет rows, byDay, stripCurve */
buildTabs();
fillGroups();
resize();
if(!ok){
  flash("WebGL недоступен — включён упрощённый режим без анимации фона");
  /* 2D-фолбэк рисует кадры по требованию */
  setInterval(function(){ draw2D(); if(dirtyOv){ layoutHeader(); layoutNames(); dirtyOv=false; } }, 60);
}
renderPanel();
requestAnimationFrame(function(n){ t0 = n; lastFrame = 0; frame(n); });

})();
</script>
